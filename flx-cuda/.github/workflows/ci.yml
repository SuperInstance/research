name: flx-cuda CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-python:
    name: Python tests (CPU fallback)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run Python tests
        run: |
          cd bindings/python
          python3 tests/test_flx_cuda.py

  test-cuda:
    name: CUDA tests (Linux GPU runner)
    runs-on: [self-hosted, gpu, cuda]
    steps:
      - uses: actions/checkout@v4
      - name: Set up CUDA
        uses: Jimver/cuda-toolkit@v0.2.11
        with:
          cuda-version: '12.0'
      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake ..
      - name: Build
        run: |
          cd build
          make -j$(nproc)
      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure

  lint:
    name: Lint (clang-format, ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: ruff check bindings/python/
